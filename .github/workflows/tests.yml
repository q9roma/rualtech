name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            database: sqlite
          - php: '8.4'
            database: mysql
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only
          MYSQL_DATABASE: altech_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, bcmath, exif, gd, dom, curl, mbstring, zip, pcntl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - run: composer validate --strict --no-check-publish
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked
      - name: Install and test catalog runtime
        run: |
          python3 -m pip install -r deploy/catalog-requirements.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: php artisan key:generate
      - run: php artisan filament:assets
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck && npm run build:ssr
      - run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'altech_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: testing-only
      - name: Validate release scripts
        run: |
          bash -n scripts/build-release.sh scripts/deploy-release.sh scripts/rollback-release.sh scripts/release-common.sh
          shellcheck scripts/*.sh
          bash scripts/test-release-helpers.sh
          bash scripts/test-release-package.sh
          php scripts/security-check.php
